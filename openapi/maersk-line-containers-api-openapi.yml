openapi: 3.2.0
info:
  title: Maersk Product Offers Containers API
  description: Quote prices and product offers for ocean shipments. Returns route and schedule, vessel and deadline information, and prices including surcharges for the requested origin, destination, container size-type combination, and departure date.
  version: '2.0'
  contact:
    name: Maersk Developer Support
    url: https://developer.maersk.com/support
servers:
- url: https://api.productmanagement.maersk.com
  description: Production
- url: https://api-spt.env.productmanagement.maersk.com
  description: Sandbox
security:
- ConsumerKey: []
- ForgeRockJWT: []
tags:
- name: Containers
  description: Supported container size and type combinations.
paths:
  /offers/v2/offers/containers:
    get:
      summary: List Supported Containers
      description: List all container size-types supported for offers.
      operationId: listContainers
      tags:
      - Containers
      responses:
        '200':
          description: Container catalog returned.
components:
  securitySchemes:
    ConsumerKey:
      type: apiKey
      in: header
      name: Consumer-Key
    ForgeRockJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
